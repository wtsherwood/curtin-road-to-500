name: Update wins and publish site

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: curtin-500-pages
  cancel-in-progress: false

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check MaxPreps and update published count
        run: python scripts/update_wins.py

      - name: Save new count and last check to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/wins.json data/state.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: refresh Curtin 500 result feed"
            git push
          fi

      - name: Prepare GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload public website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Publish GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
